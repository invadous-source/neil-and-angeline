<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neil & Anj</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  background:#fff;
  color:#4b3b40;
}
button{font-family:inherit}
main{overflow:hidden}

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:40px 20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.9),transparent 25%),
    radial-gradient(circle at 80% 70%,rgba(238,173,190,.25),transparent 30%),
    linear-gradient(180deg,#fff8fa 0%,#f8e7eb 100%);
  text-align:center;
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.hero::before{
  width:500px;
  height:500px;
  left:-240px;
  top:-220px;
  background:rgba(240,183,197,.2);
  filter:blur(60px);
}
.hero::after{
  width:450px;
  height:450px;
  right:-220px;
  bottom:-200px;
  background:rgba(255,255,255,.8);
  filter:blur(65px);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:850px;
  width:100%;
}

.eyebrow{
  letter-spacing:5px;
  font-size:12px;
  color:#9c727d;
  margin-bottom:20px;
  text-transform:uppercase;
}

.names{
  font-size:clamp(48px,10vw,105px);
  font-weight:400;
  line-height:.95;
  margin:0;
  color:#5a4148;
}

.names span{
  font-size:.45em;
  display:inline-block;
  margin:0 12px;
  color:#b98996;
  vertical-align:middle;
}

.hero-date{
  margin-top:30px;
  font-size:16px;
  letter-spacing:3px;
  color:#8b6872;
}

.cta{
  margin-top:35px;
  padding:14px 28px;
  border:1px solid #b98996;
  background:transparent;
  color:#76545e;
  border-radius:30px;
  cursor:pointer;
  transition:.25s;
  letter-spacing:1px;
}

.cta:hover{
  background:#b98996;
  color:#fff;
}

.main-photo-frame{
  width:min(78vw,320px);
  aspect-ratio:1/1;
  margin:38px auto 0;
  border-radius:50%;
  padding:9px;
  background:rgba(255,255,255,.75);
  box-shadow:0 20px 60px rgba(100,60,70,.15);
}

.main-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

@media(max-width:640px){
  .main-photo-frame{width:min(78vw,320px)}
}

/* SAVE THE DATE + COUNTDOWN */
.save-date-section{
  position:relative;
  padding:82px 20px 95px;
  overflow:hidden;
  text-align:center;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.9),transparent 22%),
    radial-gradient(circle at 85% 78%,rgba(238,173,190,.20),transparent 28%),
    linear-gradient(180deg,#fff8fa 0%,#f7e8ec 100%);
}

.save-date-section::before,
.save-date-section::after{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  filter:blur(55px);
  opacity:.28;
  pointer-events:none;
}

.save-date-section::before{
  background:#f0b7c5;
  top:-110px;
  left:-90px;
}

.save-date-section::after{
  background:#fff;
  right:-100px;
  bottom:-130px;
}

.save-date-inner{
  position:relative;
  z-index:1;
  max-width:900px;
  margin:auto;
}

.section-heading h2{
  margin:0;
  font-size:clamp(28px,5vw,46px);
  font-weight:400;
  letter-spacing:3px;
  color:#624750;
}

.section-heading p{
  margin:12px 0 0;
  color:#a17884;
  letter-spacing:2px;
  font-size:13px;
}

.countdown-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  max-width:720px;
  margin:48px auto 0;
}

.countdown-group{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.flip-pair{
  display:flex;
  gap:5px;
}

.flip-card{
  width:55px;
  height:68px;
  border-radius:9px;
  background:linear-gradient(180deg,#694f57 0%,#4d3940 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  box-shadow:0 8px 20px rgba(60,35,42,.18);
}

.countdown-group small{
  margin-top:12px;
  font-size:10px;
  letter-spacing:2px;
  color:#8b6872;
}

.details{
  padding:70px 20px;
  background:#fff;
  text-align:center;
}

.details h2{
  font-size:32px;
  font-weight:400;
  margin:0 0 35px;
  color:#624750;
}

.details-grid{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.detail{
  padding:25px;
  border:1px solid #ead6dc;
  border-radius:15px;
  background:#fffafb;
}

.detail span{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#a17884;
  margin-bottom:10px;
}

.detail strong{
  font-size:18px;
  font-weight:400;
  color:#624750;
}

@media(max-width:700px){
  .countdown-grid{
    grid-template-columns:repeat(2,1fr);
    gap:28px 15px;
  }

  .details-grid{
    grid-template-columns:1fr;
  }
}

.gallery{
  padding:80px 20px;
  background:#fff8fa;
}

.gallery-inner{
  max-width:1050px;
  margin:auto;
  text-align:center;
}

.gallery h2{
  font-size:34px;
  font-weight:400;
  margin:0 0 35px;
  color:#624750;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.gallery-grid img{
  width:100%;
  height:360px;
  object-fit:cover;
  border-radius:14px;
  display:block;
  box-shadow:0 12px 35px rgba(70,40,48,.12);
}

@media(max-width:700px){
  .gallery-grid{
    grid-template-columns:1fr;
  }

  .gallery-grid img{
    height:330px;
  }
}

.music-control{
  position:fixed;
  right:20px;
  bottom:20px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.8);
  background:#73535d;
  color:#fff;
  cursor:pointer;
  z-index:20;
  box-shadow:0 8px 25px rgba(50,30,35,.2);
}

.envelope-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(58,39,44,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  transition:.6s;
}

.envelope-overlay.hidden{
  opacity:0;
  pointer-events:none;
}

.envelope{
  width:min(90vw,500px);
  padding:50px 35px;
  text-align:center;
  border-radius:18px;
  background:#fff8fa;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.envelope h1{
  font-size:44px;
  font-weight:400;
  margin:0 0 10px;
  color:#624750;
}

.envelope p{
  color:#97747d;
  margin:0 0 30px;
}

.open-button{
  border:0;
  background:#73535d;
  color:#fff;
  padding:14px 30px;
  border-radius:30px;
  cursor:pointer;
  letter-spacing:1px;
}

footer{
  text-align:center;
  padding:30px 20px;
  font-size:12px;
  color:#a17884;
  background:#fff8fa;
}
</style>
</head>

<body>

<div class="envelope-overlay" id="envelopeOverlay">
  <div class="envelope">
    <div class="eyebrow">YOU ARE INVITED</div>
    <h1>Neil & Anj</h1>
    <p>Open our invitation</p>
    <button class="open-button" id="envelopeButton">Open Invitation</button>
  </div>
</div>

<audio id="weddingMusic" loop>
  <source src="YOUR_WEDDING_SONG.mp3" type="audio/mpeg">
</audio>

<button class="music-control" id="musicToggle" aria-label="Play music">▶</button>

<main>

  <section class="hero">
    <div class="hero-content">
      <div class="eyebrow">WE ARE GETTING MARRIED</div>

      <h1 class="names">
        Neil <span>&</span> Anj
      </h1>

      <div class="hero-date">
        NOVEMBER 26, 2026 • THURSDAY
      </div>

      <div class="main-photo-frame">
        <img class="main-photo" src="main-photo.png" alt="Neil and Anj">
      </div>

      <button class="cta" onclick="document.getElementById('details').scrollIntoView({behavior:'smooth'})">
        Explore Our Celebration
      </button>
    </div>
  </section>

  <!-- SAVE THE DATE -->
  <section class="save-date-section" id="save-date">
    <div class="save-date-inner">
      <div class="section-heading">
        <h2>SAVE THE DATE</h2>
        <p>NOVEMBER 26, 2026 • THURSDAY</p>
      </div>

      <div class="countdown-grid" aria-label="Wedding countdown">

        <div class="countdown-group">
          <div class="flip-pair">
            <div class="flip-card"><span id="daysTens">0</span></div>
            <div class="flip-card"><span id="daysOnes">0</span></div>
          </div>
          <small>DAYS</small>
        </div>

        <div class="countdown-group">
          <div class="flip-pair">
            <div class="flip-card"><span id="hoursTens">0</span></div>
            <div class="flip-card"><span id="hoursOnes">0</span></div>
          </div>
          <small>HOURS</small>
        </div>

        <div class="countdown-group">
          <div class="flip-pair">
            <div class="flip-card"><span id="minutesTens">0</span></div>
            <div class="flip-card"><span id="minutesOnes">0</span></div>
          </div>
          <small>MINUTES</small>
        </div>

        <div class="countdown-group">
          <div class="flip-pair">
            <div class="flip-card"><span id="secondsTens">0</span></div>
            <div class="flip-card"><span id="secondsOnes">0</span></div>
          </div>
          <small>SECONDS</small>
        </div>

      </div>
    </div>
  </section>

  <section class="gallery">
    <div class="gallery-inner">
      <h2>Our Moments</h2>

      <div class="gallery-grid">
        <img src="photo1.jpg" alt="Our moment">
        <img src="photo2.jpg" alt="Our moment">
        <img src="photo3.jpg" alt="Our moment">
      </div>
    </div>
  </section>

  <footer>
    Made with love • Neil &amp; Anj
  </footer>

</main>

<script>
const envelope = document.getElementById('envelopeButton');
let opened = false;

const music = document.getElementById('weddingMusic');
const musicToggle = document.getElementById('musicToggle');

function updateMusicButton(){
  musicToggle.textContent = music.paused ? '▶' : '❚❚';
  musicToggle.setAttribute(
    'aria-label',
    music.paused ? 'Play music' : 'Pause music'
  );
}

function openInvitation(){
  if(opened) return;
  opened = true;

  document.getElementById('envelopeOverlay').classList.add('hidden');

  music.play().then(() => {
    updateMusicButton();
  }).catch(() => {
    updateMusicButton();
  });
}

envelope.addEventListener('click', openInvitation);

musicToggle.addEventListener('click', () => {
  if(music.paused){
    music.play().catch(() => {});
  }else{
    music.pause();
  }

  updateMusicButton();
});

music.addEventListener('play', updateMusicButton);
music.addEventListener('pause', updateMusicButton);

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){
    if(!opened){
      e.preventDefault();
      openInvitation();
    }
  }
});


// SAVE THE DATE COUNTDOWN
// Replace this placeholder with your actual wedding date later.
const weddingDate = new Date('2026-11-26T15:00:00');

function setTwoDigits(prefix, value){
  const text = String(Math.max(0, value)).padStart(2, '0');

  const tens = document.getElementById(prefix + 'Tens');
  const ones = document.getElementById(prefix + 'Ones');

  if(tens) tens.textContent = text[0];
  if(ones) ones.textContent = text[1];
}

function updateCountdown(){
  const now = new Date();
  let difference = weddingDate - now;

  if(difference < 0){
    difference = 0;
  }

  const totalSeconds = Math.floor(difference / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  setTwoDigits('days', days);
  setTwoDigits('hours', hours);
  setTwoDigits('minutes', minutes);
  setTwoDigits('seconds', seconds);
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
